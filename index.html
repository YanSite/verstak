<style>
/* Верстак. Сайт рисуется в логическом кадре 390 px (телефон) или 1440 px (компьютер) и масштабируется по ширине окна. */
:root{
  --night:#16110D; --shadow:#2A211A; --oak:#6B4A2E; --wax:#C9A36A; --seam:#B08A5A; --rind:#5A4636;
  --linen:#E6DCC8; --thread:#F2EBDD; --paper:#EFE7D8; --muted:#A8957C;
  --serif:'Spectral', 'PT Serif', Georgia, serif; --display:var(--serif); --mono:'JetBrains Mono', 'PT Mono', ui-monospace, monospace;
  /* motion tokens */
  --t-touch:240ms; --t-text:600ms; --t-frame:800ms; --t-camera:2400ms;
  --ease-glance:cubic-bezier(.33,0,.2,1); --ease-settle:cubic-bezier(.22,.61,.36,1); --ease-light:cubic-bezier(.45,0,.55,1);
  color-scheme:dark;
}
[hidden]{display:none!important}
/* Метка «Концепт» — под корзиной справа, не на названии раздела в шапке. */
concept-card{--cc-font:'Ysabeau','PT Sans',system-ui,sans-serif;--cc-top:58px;--cc-right:10px}
@media (min-width:1000px){concept-card{--cc-top:76px;--cc-right:46px}}
/* type pairings: a «Верстак» (Spectral + JetBrains Mono), b «Резак» (Piazzolla + IBM Plex Mono), c «Клеймо» (Prata over Spectral + PT Mono), d «Бирка» (Ysabeau + IBM Plex Mono) */
:root[data-font="b"]{--serif:'Piazzolla','PT Serif',Georgia,serif;--display:'Piazzolla','PT Serif',Georgia,serif;--mono:'IBM Plex Mono','PT Mono',ui-monospace,monospace}
:root[data-font="c"]{--serif:'Spectral','PT Serif',Georgia,serif;--display:'Prata','PT Serif',Georgia,serif;--mono:'PT Mono',ui-monospace,monospace}
:root[data-font="d"]{--serif:'Ysabeau','PT Sans',system-ui,sans-serif;--display:'Ysabeau','PT Sans',system-ui,sans-serif;--mono:'IBM Plex Mono','PT Mono',ui-monospace,monospace}
html,body{height:100%}
body{background:var(--shadow);color:var(--linen);font-family:var(--serif);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--wax);outline-offset:2px}

/* ---------- shell ---------- */
.shell{height:100%;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px dashed rgba(176,138,90,.35);font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.bar .ttl{color:var(--thread);font-family:var(--serif);font-size:17px;letter-spacing:0;font-weight:300;margin-right:6px}
.seg{display:inline-flex;border:1px solid rgba(176,138,90,.5)}
.seg button,.tg,.bar .plain{background:none;border:0;padding:8px 12px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--wax);color:var(--shadow)}
.tg{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(176,138,90,.5)}
.tg .box{width:14px;height:14px;border:1px solid var(--wax);display:inline-block}
.tg[aria-pressed="true"] .box{background:var(--wax)}
.bar .plain{border:1px solid rgba(176,138,90,.5)}
.bar .hint{color:var(--muted);margin-left:auto}
.area{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);overflow:hidden;background:var(--shadow)}
.devbox{position:relative;width:100%;height:100%}
.status{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--mono);font-size:12px;color:var(--shadow);background:var(--wax);padding:8px 12px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
.status.show{opacity:1}
@media (max-width:520px){.bar .hint{display:none}.area{padding:0}.devbox{box-shadow:none}}

/* ---------- site ---------- */
.site{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--shadow);color:var(--thread);font-family:var(--serif)}
.site a{color:inherit;text-decoration:none}
.site .mono{font-family:var(--mono)}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scroll-behavior:auto;outline:none}
.site.m .scroller{scrollbar-width:none}.site.m .scroller::-webkit-scrollbar{display:none}
.site.d .scroller{scrollbar-width:thin;scrollbar-color:var(--rind) transparent}
.stage{position:sticky;top:0;overflow:hidden;background:var(--shadow)}
.site:not(.rm) .stage,.site:not(.rm) .hud,.site:not(.rm) .rail{touch-action:none;-webkit-user-select:none;user-select:none}
.fr{position:absolute;inset:0;opacity:0;overflow:hidden}
.fr .cam{position:absolute;inset:0;will-change:transform}
.fr .cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform var(--t-camera) var(--ease-glance),filter var(--t-camera) var(--ease-light)}
.fr .txt{position:absolute;will-change:opacity}
.dim{position:absolute;inset:0;background:#0f0b08;opacity:0;pointer-events:none}
.beam{position:absolute;inset:-25%;pointer-events:none;mix-blend-mode:screen;opacity:.75;
  background:linear-gradient(104deg,transparent 40%,rgba(255,206,140,0) 45%,rgba(255,206,140,.30) 50%,rgba(255,206,140,0) 55%,transparent 60%)}
.scrimB{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
.scrimL{position:absolute;left:0;top:0;bottom:0;pointer-events:none}

.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--wax);margin:0}
.h1{margin:0;font-weight:300;letter-spacing:-.01em;line-height:1.05}
.sub{margin:0;font-weight:300;color:var(--linen)}
.cue{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--linen)}
.cue i{display:block;width:1px;height:36px;background:var(--wax)}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--thread);transition:color var(--t-text)}
.site.m .hud{padding:20px 12px 0 20px;font-size:11px}
.site.d .hud{padding:32px 56px 0;font-size:12px}
.hud .r{display:flex;align-items:center;gap:8px}
.site.d .hud nav{display:flex;gap:40px}
.hud button{background:none;border:0;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono);font-size:inherit;padding:14px 6px}
.burger{width:44px;height:44px;display:flex!important;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:0!important}
.burger span{display:block;width:20px;height:1px;background:currentColor}
.hud.paper{color:var(--shadow);background:var(--paper);box-shadow:0 1px 0 rgba(176,138,90,.35)}
.site.m .hud.paper{padding-bottom:8px}.site.d .hud.paper{padding-bottom:20px}
.hud .sec{transition:opacity var(--t-text)}
.rail{position:absolute;left:0;right:0;top:0;height:2px;z-index:21;background:rgba(230,220,200,.12)}
.rail i{display:block;height:100%;width:0;background:var(--wax)}
.count{position:absolute;z-index:21;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.site.m .count{left:20px;top:66px}
.site.d .count{left:56px;top:66px}
.count.paper{color:var(--rind)}

/* items */
.detail{opacity:0;transition:opacity var(--t-text) var(--ease-glance)}
.fr.arrived .detail,.site.lite .detail,.site.rm .detail{opacity:1}
.fr.arrived .detail{transition-delay:1000ms}
.fr.arrived .cam img.zoomy{transform:scale(1.12)}
.fr:not(.arrived) .cam img.zoomy{transition-duration:500ms}

/* grid (desktop) */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.tile{display:flex;flex-direction:column;gap:14px;color:var(--thread);cursor:pointer;background:none;border:0;padding:0;text-align:left;font-family:var(--serif)}
.tile .ph{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:#3A2D22}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1400ms var(--ease-glance)}
.tile .glow{position:absolute;inset:0;opacity:0;mix-blend-mode:screen;transition:opacity 900ms var(--ease-light);pointer-events:none}
.tile .shade{position:absolute;inset:0;background:#120d0a;opacity:0;transition:opacity 900ms var(--ease-light);pointer-events:none}
.tiles.hovering .tile .shade{opacity:.5}
.tiles.hovering .tile.on .shade{opacity:0}
.tile.on .ph img{transform:scale(1.07)}
.tile.on .glow{opacity:1}
.site.lite .tile .glow{display:none}.site.lite .tile.on .ph img{transform:none}

/* steps */
.bars{display:flex;gap:4px}
.bars b{display:block;width:18px;height:2px;background:rgba(230,220,200,.35);position:relative;overflow:hidden}
.bars b i{position:absolute;inset:0;background:var(--wax);transform-origin:0 50%;transform:scaleX(0)}
.site.d .bars{gap:6px}.site.d .bars b{width:28px}
.stitch{position:absolute;left:0;right:0;pointer-events:none}

/* time */
.tscale{position:relative;height:28px;cursor:grab;touch-action:none}
.tscale .line{position:absolute;left:0;right:0;top:13px;height:2px;background:linear-gradient(90deg,#E6DCC8,#C9A36A,#8A5A2B)}
.tscale .dot{position:absolute;top:8px;width:12px;height:12px;border-radius:6px;background:var(--shadow);border:1.5px solid var(--thread);box-sizing:border-box}
.tscale:active{cursor:grabbing}
.tlabels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--linen)}
.swap{position:relative}
.site.lite .swap > div,.site.lite .fr.time .later{transition:opacity 500ms var(--ease-settle)}

/* workshop */
.ln{opacity:1;transform:none;transition:opacity var(--t-text) var(--ease-glance),transform var(--t-text) var(--ease-glance)}
.site.full .fr.ws:not(.arrived) .ln{opacity:0;transform:translateY(6px)}
.fr.ws.arrived .ln:nth-child(2){transition-delay:300ms}.fr.ws.arrived .ln:nth-child(3){transition-delay:650ms}.fr.ws.arrived .ln:nth-child(4){transition-delay:1000ms}
.fr.ws.arrived .cam img{transform:scale(1.06)}

/* hero dawn */
.site.full.dawn .fr.hero .cam img{filter:brightness(.32) saturate(.7);transition:none}
.site.full.dawn .fr.hero .beam{opacity:0;transition:none}
.site.full.dawn .fr.hero .txt{opacity:0!important;transition:none}
.site.waking .fr.hero .cam img{transition:filter var(--t-camera) var(--ease-light)}
.site.waking .fr.hero .beam{transition:opacity 2000ms var(--ease-light) 500ms}
.site.waking .fr.hero .txt{transition:opacity 700ms var(--ease-glance) 700ms}

/* paper (free scroll) */
.paperz{background:var(--paper);color:var(--shadow);position:relative;z-index:2}
.reveal{transition:opacity 700ms var(--ease-glance),transform 700ms var(--ease-glance)}
.reveal.pre{opacity:0;transform:translateY(8px)}
.dl-row{border-top:1px dashed var(--seam);display:flex;flex-direction:column;gap:4px}
.dl-row dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--oak)}
.dl-row dd{margin:0;font-weight:300}
.btn-dark{display:flex;align-items:center;justify-content:center;background:var(--shadow);color:var(--thread)!important;font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;border:0;cursor:pointer}
.btn-wax{display:flex;align-items:center;justify-content:center;background:var(--wax);color:var(--shadow);font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:0;cursor:pointer}
.foot{background:var(--shadow);color:var(--thread);position:relative;z-index:2}

/* lite & reduced */
.site.lite .beam,.site.rm .beam{display:none}
.site.lite .fr{transition:opacity 500ms var(--ease-settle)}
.site.lite .fr .cam img,.site.rm .fr .cam img{transform:none!important;transition:none}
.site.rm *,.site.rm *::before,.site.rm *::after{transition:none!important;animation:none!important}

/* card */
.card{position:absolute;inset:0;z-index:40;background:var(--paper);color:var(--shadow);overflow-y:auto;overscroll-behavior:contain}
.site.m .card{scrollbar-width:none}
.card a{color:var(--shadow)}
.card .hero-img{overflow:hidden;position:relative}
.card .hero-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1800ms var(--ease-glance)}
.card.opening .hero-img img{transform:scale(1.06);transition:none}
.card > *{transition:opacity 500ms var(--ease-glance)}
.card.opening > *{opacity:0;transition:none}
.card h2{margin:0;font-weight:300}
.card .linkline{display:flex;align-items:center;min-height:44px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--oak)!important;background:none;border:0;padding:0;cursor:pointer}
.mini{position:relative;overflow:hidden}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini .later{opacity:0}
.range{width:100%;appearance:none;-webkit-appearance:none;background:transparent;height:28px;margin:0;cursor:grab}
.range::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,#D9CDB8,#C9A36A,#8A5A2B)}
.range::-moz-range-track{height:2px;background:linear-gradient(90deg,#D9CDB8,#C9A36A,#8A5A2B)}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:7px;background:var(--paper);border:1.5px solid var(--shadow);margin-top:-6px}
.range::-moz-range-thumb{width:12px;height:12px;border-radius:6px;background:var(--paper);border:1.5px solid var(--shadow)}
.thread{position:relative;height:2px;background-image:repeating-linear-gradient(90deg,var(--wax) 0 6px,transparent 6px 12px)}
.thread::after{content:"";position:absolute;inset:0;background:var(--wax);transform:scaleX(0);transform-origin:0 50%;opacity:0}
.thread.pull::after{animation:pull 900ms var(--ease-settle)}
@keyframes pull{0%{transform:scaleX(0);opacity:1}55%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.stickybar{position:sticky;bottom:0;z-index:5;background:var(--shadow);color:var(--thread)}
.cnt.tick{animation:tick 500ms var(--ease-settle)}
@keyframes tick{0%{color:var(--wax)}100%{color:inherit}}

/* overlays */
.backdrop{position:absolute;inset:0;z-index:55;background:rgba(15,11,8,.5);opacity:0;transition:opacity 400ms}
.backdrop.show{opacity:1}
.sheet{position:absolute;z-index:60;background:var(--paper);color:var(--shadow);display:flex;flex-direction:column;transition:transform 600ms var(--ease-settle)}
.site.m .sheet{left:0;right:0;bottom:0;height:72%;transform:translateY(100%)}
.site.d .sheet{top:0;right:0;bottom:0;width:440px;transform:translateX(100%)}
.sheet.show{transform:none}
.sheet .in{padding:24px 20px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;flex:1}
.site.d .sheet .in{padding:40px 40px}
.xbtn{width:44px;height:44px;background:none;border:0;cursor:pointer;font-family:var(--mono);font-size:20px;line-height:1}
.menu{position:absolute;inset:0;z-index:58;background:var(--shadow);color:var(--thread);padding:84px 20px 40px;display:flex;flex-direction:column;gap:6px}
.menu button{background:none;border:0;text-align:left;cursor:pointer;font-family:var(--serif);font-weight:300;font-size:30px;padding:8px 0;color:var(--thread);border-bottom:1px dashed rgba(201,163,106,.4)}
.flip{position:absolute;z-index:50;overflow:hidden;pointer-events:none}
.h1,.card h1,.card h2,.menu button:not(#menuClose),.foot p:first-child{font-family:var(--display)}
.flip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style>

/* ================= build ================= */
var site, scroller, stage, frames, VH, STOPS, FREE, END;
function build(){
  var pm = pickMode(); S.mode = pm.mode; MODES[S.mode].H = pm.H; S.scale = pm.sc;
  var M = MODES[S.mode], m = S.mode==='m';
  VH = M.H;
  frames = M.frames.map(function(f){ return {id:f.id,s:f.s,e:(f.e==null?f.s:f.e),trans:f.trans}; });
  END = frames[frames.length-1].e;
  var html = '';
  html += heroFr(m)+edgeFr(m);
  if(m) ITEMS.forEach(function(it,i){html+=itemFr(it,i);}); else html+=gridFr();
  STEPS.forEach(function(st,i){html+=stepFr(st,i,m);});
  html += timeFr(m)+wsFr(m);
  var box = $('#devbox');
  box.innerHTML = '<div class="site '+S.mode+'" id="site" style="width:'+M.W+'px;height:'+M.H+'px;transform:scale('+S.scale+')">'+hud(m)+
   '<div class="rail" aria-hidden="true"><i id="railFill"></i></div><div class="count" id="count" aria-hidden="true"></div>'+
   '<div class="scroller" id="scroller" tabindex="0" aria-label="Главная">'+
   '<div class="track" style="height:'+((END+1)*VH)+'px"><div class="stage" id="stage" style="height:'+VH+'px">'+html+'<div class="dim" id="dim"></div></div></div>'+paperZone(m)+'</div>'+
   cardView(m)+overlays(m)+'</div>';
  site = $('#site'); scroller = $('#scroller'); stage = $('#stage');
  frames.forEach(function(f){ f.el = stage.querySelector('[data-id="'+f.id+'"]'); f.cam = f.el.querySelector('.cam'); f.txt = f.el.querySelector('.txt'); f.beam = f.el.querySelector('.beam'); });
  STOPS = [];
  frames.forEach(function(f){ STOPS.push({px:f.s*VH,id:f.id,at:'s'}); if(f.e!==f.s) STOPS.push({px:f.e*VH,id:f.id,at:'e'}); });
  FREE = (END+1)*VH; STOPS.push({px:FREE,id:'free',at:'s'});
  applyFlags(); wire(); fit(); render();
  // first screen immediately; the rest loads in the background
  setTimeout(loadRest, 350);
  if(!S.rm && !S.lite){ site.classList.add('dawn'); requestAnimationFrame(function(){requestAnimationFrame(function(){ site.classList.add('waking'); site.classList.remove('dawn'); setTimeout(function(){ site && site.classList.remove('waking'); }, 3200); });}); }
  settle();
}
function loadRest(){ $$('img[data-src]',site).forEach(function(i){ i.decoding='async'; i.src=i.getAttribute('data-src'); i.removeAttribute('data-src'); }); }
function applyFlags(){
  if(!site) return;
  site.classList.toggle('lite',S.lite && !S.rm);
  site.classList.toggle('rm',S.rm);
  site.classList.toggle('full',!S.lite && !S.rm);
  $$('.reveal',site).forEach(function(r){ r.classList.toggle('pre', !S.rm && !r.classList.contains('in')); });
}
function fit(){
  var pm = pickMode();
  if(site && (pm.mode!==S.mode || Math.abs(pm.H-MODES[S.mode].H)>2)){ rebuildKeep(); return; }
  S.scale = pm.sc; if(site) site.style.transform = 'scale('+pm.sc+')';
}

/* ================= render ================= */
function nearestFrameIdx(t){
  var best=0, bd=1e9;
  frames.forEach(function(f,i){ var d = t<f.s ? f.s-t : (t>f.e ? t-f.e : 0); if(d<bd){bd=d;best=i;} });
  return best;
}
function render(){
  var y = scroller.scrollTop, t = y/VH, full = !S.lite && !S.rm;
  var n = frames.length, i, f;
  for(i=0;i<n;i++){ f=frames[i]; f.o=0; f.x=0; f.y=0; f.s2=1; f.local=0; f.zoom=0; }
  var dim = 0;
  if(full){
    var k=-1;
    for(i=0;i<n;i++){ f=frames[i]; if(t>=f.s && t<=f.e){ f.o=1; f.local = f.e>f.s ? (t-f.s)/(f.e-f.s) : 0; k=-2; break; } }
    if(k===-1){
      if(t<frames[0].s){ frames[0].o=1; }
      else if(t>frames[n-1].e){ frames[n-1].o=1; frames[n-1].local=1; }
      else for(i=0;i<n-1;i++){
        var A=frames[i], B=frames[i+1];
        if(t>A.e && t<B.s){
          var u=(t-A.e)/(B.s-A.e), mm;
          if(A.trans==='zoom'){ A.zoom=sstep(0,1,u); mm=sstep(.5,.92,u); A.o=1-mm; B.o=mm; B.s2=1.12-.12*sstep(.5,1,u); }
          else if(A.trans==='pan'){ mm=sstep(0,1,u); A.o=1-mm; B.o=mm; A.x=-9*mm; A.s2=1+.02*mm; B.x=9*(1-mm); dim=.25*Math.sin(Math.PI*mm); }
          else { mm=sstep(.04,.96,u); A.o=1-mm; B.o=mm; A.y=-3*mm; A.s2=1+.03*mm; B.y=4*(1-mm); B.s2=1.06-.06*mm; dim=.45*Math.sin(Math.PI*mm); }
          if(A.e>A.s) A.local=1; break;
        }
      }
    }
  } else {
    var ai = nearestFrameIdx(t); var fa = frames[ai]; fa.o = 1;
    if(fa.e>fa.s) fa.local = ((t-fa.s)/(fa.e-fa.s))>=.5 ? 1 : 0;
  }
  for(i=0;i<n;i++){
    f=frames[i];
    if(full){ f.el.style.opacity = f.o.toFixed(3); f.el.classList.remove('on'); }
    else { f.el.style.opacity = f.o?'1':'0'; }
    var vis = f.o>.5; if(f.el.inert!==!vis) f.el.inert = !vis;
    f.el.style.zIndex = vis?2:1;
    if(f.cam && full){
      var sc = f.s2, tx=f.x, ty=f.y;
      if(f.id==='hero'){ sc = 1+0.9*f.zoom; }
      if(f.id==='time'){ sc = sc*(1+.03*f.local); }
      f.cam.style.transform = 'translate('+tx.toFixed(2)+'%,'+ty.toFixed(2)+'%) scale('+sc.toFixed(4)+')';
    } else if(f.cam){ f.cam.style.transform=''; }
    if(f.txt && full){
      var to = sstep(.3,.85,f.o);
      if(f.id==='hero') to *= 1-sstep(0,.25,f.zoom);
      f.txt.style.opacity = to.toFixed(3);
    } else if(f.txt){ f.txt.style.opacity=''; }
    if(f.beam && full){
      if(f.id==='hero') f.beam.style.transform='translateX('+(-30+62*f.zoom).toFixed(2)+'%)';
      else f.beam.style.transform='translateX('+(4+10*clamp(t-f.s,-1,1)).toFixed(2)+'%)';
    }
  }
  $('#dim').style.opacity = dim.toFixed(3);
  // steps: progress bars and stitch
  var s1 = frames.filter(function(f){return f.id==='st1';})[0], st2 = frames.filter(function(f){return f.id==='st2';})[0];
  var P = t - s1.s, curStep = clamp(Math.round(P),0,3);
  if(!stage._bars) stage._bars = $$('.bars',stage).map(function(bars){ return $$('b i',bars); });
  stage._bars.forEach(function(list){
    list.forEach(function(b,j){ var v = full ? clamp(P-(j-1),0,1) : (j<=curStep?1:0); b.style.transform='scaleX('+v.toFixed(3)+')'; });
  });
  var rect = $('#stRect',stage);
  if(rect){ var d = full ? sstep(-.7,-.05,t-st2.s)*(1-sstep(.35,.85,t-st2.s)) : (Math.abs(t-st2.s)<.5?1:0); rect.setAttribute('width', (d*(S.mode==='m'?400:1460)).toFixed(1)); }
  // time
  var tf = frames.filter(function(f){return f.id==='time';})[0];
  var mix = full ? clamp((t-tf.s)/(tf.e-tf.s),0,1) : tf.local;
  var later = tf.el.querySelector('.later'); later.style.opacity = (full?sstep(0,1,mix):mix).toFixed(3);
  var tA=$('#tA',stage), tB=$('#tB',stage);
  tA.style.opacity = (full?1-sstep(.42,.5,mix):(mix<.5?1:0)).toFixed(3); tB.style.opacity = (full?sstep(.5,.58,mix):(mix>=.5?1:0)).toFixed(3);
  var dot=$('#tdot',stage); dot.style.left = 'calc('+(mix*100).toFixed(2)+'% - '+(12*mix).toFixed(2)+'px)';
  var ts=$('#tscale',stage); ts.setAttribute('aria-valuenow',Math.round(mix*100)); ts.setAttribute('aria-valuetext', mix<.5?'Сейчас':'Через годы');
  // HUD, rail, counter
  var onPaper = y >= FREE - 60;
  var hudEl=$('#hud'); hudEl.classList.toggle('paper',onPaper);
  var fi = nearestFrameIdx(t), sec = onPaper ? 'Как купить' : SEC[frames[fi].id];
  var hs=$('#hudSec'); var label = sec==='name' ? 'Верстак' : sec; if(hs.textContent!==label) hs.textContent=label;
  var framed = STOPS.length-1, si = 0, bd=1e9;
  for(i=0;i<framed;i++){ var dd=Math.abs(STOPS[i].px-y); if(dd<bd){bd=dd;si=i;} }
  $('#railFill').style.width = (onPaper?100:(y/(FREE)*100)).toFixed(2)+'%';
  var c=$('#count'); c.textContent = onPaper ? '' : (si+1<10?'0':'')+(si+1)+' / '+(framed<10?'0':'')+framed; c.classList.toggle('paper',onPaper);
}

/* ================= scroll engine ================= */
function nearestStop(y){ var bi=0,bd=1e9; STOPS.forEach(function(s,i){var d=Math.abs(s.px-y); if(d<bd){bd=d;bi=i;}}); return bi; }
function curIdx(){ return nearestStop(scroller.scrollTop); }
function tween(to, dur, done){
  if(S.tw) cancelAnimationFrame(S.tw.raf);
  var from = scroller.scrollTop; if(Math.abs(to-from)<1){ scroller.scrollTop=to; S.tw=null; if(done)done(); return; }
  clearArrived();
  var t0 = performance.now(), tw = S.tw = {raf:0};
  (function step(now){
    var p = clamp((now-t0)/dur,0,1);
    scroller.scrollTop = from + (to-from)*EASE_TWEEN(p);
    if(p<1){ tw.raf = requestAnimationFrame(step); } else { S.tw=null; S.lockUntil = performance.now()+120; if(done)done(); settle(); if(S.queued){ var q=S.queued; S.queued=0; stepDir(q); } }
  })(t0);
}
function durFor(a,b){
  if(S.lite) return 450;
  var A=STOPS[a], B=STOPS[b];
  if(A && B && A.id==='time' && B.id==='time') return 1400;
  return 800;
}
function goTo(idx){
  idx = clamp(idx,0,STOPS.length-1);
  var cur = curIdx();
  if(S.rm){ scroller.scrollTop = STOPS[idx].px; settle(); return; }
  tween(STOPS[idx].px, durFor(cur,idx));
}
function goToId(id){
  if(id==='0'||id===0) return goTo(0);
  for(var i=0;i<STOPS.length;i++){ if(STOPS[i].id===id){ return goTo(i); } }
}
function stepDir(dir){
  var y = scroller.scrollTop, idx = nearestStop(y);
  if(Math.abs(STOPS[idx].px - y) > 4){ // between stops: go to the next one in that direction
    for(var i=0;i<STOPS.length;i++){ if(dir>0 && STOPS[i].px>y+4){ return goTo(i);} }
    for(var j=STOPS.length-1;j>=0;j--){ if(dir<0 && STOPS[j].px<y-4){ return goTo(j);} }
    return;
  }
  goTo(idx+dir);
}
function inFree(){ return scroller.scrollTop >= FREE - 2; }
function clearArrived(){ frames && frames.forEach(function(f){ f.el.classList.remove('arrived'); }); }
function settle(){
  if(!site) return;
  var y = scroller.scrollTop, idx = nearestStop(y);
  clearArrived();
  if(Math.abs(STOPS[idx].px-y) < 3 && !S.lite && !S.rm){
    var f = frames.filter(function(fr){return fr.id===STOPS[idx].id;})[0];
    if(f) f.el.classList.add('arrived');
  }
}
var snapT;
function onScroll(){
  render();
  if(S.tw || S.rm || S.dragging) return;
  clearTimeout(snapT);
  snapT = setTimeout(function(){
    var y = scroller.scrollTop;
    if(y > FREE + 2){ settle(); return; }
    var idx = nearestStop(y);
    if(Math.abs(STOPS[idx].px - y) > 2) tween(STOPS[idx].px, S.lite?400:600); else settle();
  }, 170);
}
var wheelAcc=0, lastWheel=0, gestureUsed=false;
function onWheel(e){
  if(S.rm || S.cardOpen) return;
  var now = performance.now(), gap = now - lastWheel; lastWheel = now;
  if(gap > 140){ wheelAcc = 0; gestureUsed = false; }   // a new gesture; inertia keeps gaps short
  if(inFree()){
    if(e.deltaY<0 && scroller.scrollTop <= FREE+1){ e.preventDefault(); if(!gestureUsed){ gestureUsed=true; if(S.tw) S.queued=-1; else goTo(STOPS.length-2);} }
    return;
  }
  e.preventDefault();
  if(gestureUsed) return;
  wheelAcc += e.deltaY;
  if(Math.abs(wheelAcc) > 18){
    var d = wheelAcc>0?1:-1; wheelAcc=0; gestureUsed=true;
    if(S.tw){ S.queued = d; return; }   // remember one step, take it right after the current frame lands
    stepDir(d);
  }
}
var tY=null, tX=null, tOnScale=false;
var tFired=false;
var tT=0;
function onTouchStart(e){ if(e.touches.length!==1) return; tY=e.touches[0].clientY; tX=e.touches[0].clientX; tT=performance.now(); tFired=false; tOnScale=!!(e.target.closest && e.target.closest('.tscale')); }
function onTouchMove(e){
  if(S.rm || tY===null || tOnScale) return;
  var dy = tY - e.touches[0].clientY;
  var dx = tX - e.touches[0].clientX;
  if(!inFree()){
    e.preventDefault();
    if(!tFired && Math.abs(dy) > 18 && Math.abs(dy) > Math.abs(dx)){ tFired=true; var d=dy>0?1:-1; if(S.tw) S.queued=d; else stepDir(d); }
    return;
  }
  if(scroller.scrollTop <= FREE+1 && dy < 0){ e.preventDefault(); if(!tFired && dy < -28){ tFired=true; if(S.tw) S.queued=-1; else goTo(STOPS.length-2); } }
}
function onTouchEnd(e){
  if(S.rm || tY===null || tOnScale || tFired){ tY=null; return; }
  var t = e.changedTouches[0], dy = tY - t.clientY, dx = tX - t.clientX; tY=null;
  var quick = performance.now()-tT < 300;
  if(Math.abs(dy) < (quick?10:18) || Math.abs(dy) < Math.abs(dx)) return;
  if(inFree()){ if(dy<0 && scroller.scrollTop <= FREE+1) goTo(STOPS.length-2); return; }
  if(S.tw){ S.queued = dy>0?1:-1; return; }
  stepDir(dy>0?1:-1);
}
function onKey(e){
  if(!site || S.cardOpen) return;
  if(!$('#cartSheet').hidden || ($('#menu') && !$('#menu').hidden)) return;
  var tag = (e.target.tagName||'').toLowerCase(), role = e.target.getAttribute && e.target.getAttribute('role');
  if(role==='slider' || tag==='input') return;
  var isBtn = tag==='button' || tag==='a';
  var down = e.key==='ArrowDown'||e.key==='PageDown'||(e.key===' '&&!e.shiftKey&&!isBtn);
  var up = e.key==='ArrowUp'||e.key==='PageUp'||(e.key===' '&&e.shiftKey&&!isBtn);
  if(e.key==='Home'){ e.preventDefault(); goTo(0); return; }
  if(e.key==='End'){ e.preventDefault(); goTo(STOPS.length-1); return; }
  if(!down && !up) return;
  if(S.rm) return; // native keyboard scrolling
  if(inFree()){ if(up && scroller.scrollTop<=FREE+1){ e.preventDefault(); goTo(STOPS.length-2);} return; }
  e.preventDefault();
  if(S.tw){ S.queued = down?1:-1; return; }
  stepDir(down?1:-1);
}

/* ================= time scale (drag) ================= */
function wireScale(){
  var sc = $('#tscale',stage), tf = frames.filter(function(f){return f.id==='time';})[0];
  function setFrac(fr){ scroller.scrollTop = (tf.s + clamp(fr,0,1)*(tf.e-tf.s))*VH; }
  function frac(e){ var r = sc.getBoundingClientRect(); return (e.clientX - r.left)/r.width; }
  sc.addEventListener('pointerdown',function(e){ e.preventDefault(); S.dragging=true; if(S.tw){cancelAnimationFrame(S.tw.raf);S.tw=null;} sc.setPointerCapture(e.pointerId); setFrac(frac(e)); });
  sc.addEventListener('pointermove',function(e){ if(S.dragging) setFrac(frac(e)); });
  function end(){ if(!S.dragging) return; S.dragging=false; var y=scroller.scrollTop, mid=(tf.s+tf.e)/2*VH; if(!S.rm) tween(y<mid?tf.s*VH:tf.e*VH, 700); }
  sc.addEventListener('pointerup',end); sc.addEventListener('pointercancel',end);
  sc.addEventListener('keydown',function(e){
    var want = (e.key==='ArrowRight'||e.key==='ArrowUp') ? 'e' : ((e.key==='ArrowLeft'||e.key==='ArrowDown') ? 's' : null);
    if(!want) return; e.preventDefault();
    for(var i=0;i<STOPS.length;i++) if(STOPS[i].id==='time' && STOPS[i].at===want) return goTo(i);
  });
}

/* ================= card, cart, menu ================= */
function setCount(){ $$('.cnt',site).forEach(function(c){ c.textContent=S.cart; c.classList.remove('tick'); void c.offsetWidth; c.classList.add('tick'); }); }
function rectIn(el){ var r=el.getBoundingClientRect(), b=site.getBoundingClientRect(), sc=S.scale||1; return {x:(r.left-b.left)/sc,y:(r.top-b.top)/sc,w:r.width/sc,h:r.height/sc}; }
function flipAnim(fromRect, toRect, fromSrc, toSrc, done){
  var fl = document.createElement('div'); fl.className='flip';
  fl.innerHTML = '<img src="'+fromSrc+'" alt=""><img src="'+toSrc+'" alt="" style="opacity:0">';
  site.appendChild(fl);
  var D = 950;
  var a = fl.animate([{left:fromRect.x+'px',top:fromRect.y+'px',width:fromRect.w+'px',height:fromRect.h+'px'},{left:toRect.x+'px',top:toRect.y+'px',width:toRect.w+'px',height:toRect.h+'px'}],{duration:D,easing:'cubic-bezier(.33,0,.2,1)',fill:'forwards'});
  fl.children[1].animate([{opacity:0},{opacity:1}],{duration:D*.8,delay:D*.15,easing:'cubic-bezier(.45,0,.55,1)',fill:'forwards'});
  a.onfinish = function(){ done && done(); setTimeout(function(){ fl.animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'}).onfinish=function(){fl.remove();}; },30); };
}
function openCard(fromEl, fromSrc){
  var card=$('#card'), m=S.mode==='m';
  S.from = {y:scroller.scrollTop};
  card.scrollTop=0; card.hidden=false; S.cardOpen=true;
  var target = {x:0,y:m?64:88,w:m?390:760,h:m?488:950};
  var cardImgSrc = IMG+'bag-now.jpg';
  if(S.rm){ card.style.opacity=1; card.focus(); return; }
  if(S.lite){ card.style.transition='opacity 350ms'; card.style.opacity=0; requestAnimationFrame(function(){card.style.opacity=1;}); setTimeout(function(){card.focus();},360); return; }
  card.classList.add('opening'); card.style.opacity=0;
  card.animate([{opacity:0},{opacity:1}],{duration:700,delay:150,easing:'cubic-bezier(.45,0,.55,1)',fill:'forwards'});
  var from = fromEl ? rectIn(fromEl) : {x:0,y:0,w:m?390:1440,h:VH};
  flipAnim(from, target, fromSrc, cardImgSrc, function(){ card.style.opacity=1; card.getAnimations().forEach(function(a){a.cancel();}); requestAnimationFrame(function(){ card.classList.remove('opening'); }); card.focus(); });
}
function closeCard(thenGo){
  var card=$('#card'), m=S.mode==='m';
  function finish(){ card.hidden=true; card.style.opacity=''; S.cardOpen=false; if(thenGo){ goToId(thenGo); } else { scroller.focus({preventScroll:true}); } }
  if(thenGo){ // jump straight to that part of the main page
    if(S.from) scroller.scrollTop = S.from.y;
    if(S.rm){ finish(); return; }
    card.animate([{opacity:1},{opacity:0}],{duration:S.lite?300:600,easing:'cubic-bezier(.45,0,.55,1)',fill:'forwards'}).onfinish=finish; return;
  }
  if(S.from) scroller.scrollTop = S.from.y; render(); settle();
  if(S.rm){ finish(); return; }
  if(S.lite){ card.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'}).onfinish=finish; return; }
  var imgEl = $('#cardImg'), fromR = rectIn(imgEl);
  var toEl = m ? $('[data-id="i1"] .cam',stage) : $('.tile[data-item="0"] .ph',stage);
  var toR = rectIn(toEl);
  card.animate([{opacity:1},{opacity:0}],{duration:600,easing:'cubic-bezier(.45,0,.55,1)',fill:'forwards'}).onfinish=finish;
  flipAnim(fromR, toR, IMG+'bag-now.jpg', IMG+'item1.jpg');
}
function fmtRub(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₽'; }
function renderCart(state){
  var inn=$('#cartIn');
  if(state==='demo'){
    inn.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h2 id="cartTitle" class="h1" style="font-size:30px">Спасибо</h2><button class="xbtn" data-cart-close aria-label="Закрыть">×</button></div><p style="margin:0;font-size:20px;line-height:1.45;font-weight:300">Это Концепт: заказы здесь не принимаются.</p><button class="btn-dark" data-cart-close style="height:52px">Вернуться к вещам</button>'; return;
  }
  var body = S.cart ? '<div style="display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px dashed var(--seam);border-bottom:1px dashed var(--seam)"><img src="'+IMG+'item1.jpg" alt="" style="width:64px;height:80px;object-fit:cover"><div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:20px;font-weight:300">Сумка через плечо</span><span class="mono" style="font-size:13px">28 000 ₽</span><span style="display:flex;align-items:center;gap:6px"><button class="xbtn" data-q="-1" aria-label="Меньше" style="width:36px;height:36px;font-size:16px;border:1px solid var(--seam)">−</button><span class="mono" style="min-width:24px;text-align:center">'+S.cart+'</span><button class="xbtn" data-q="1" aria-label="Больше" style="width:36px;height:36px;font-size:16px;border:1px solid var(--seam)">+</button></span></div></div><div style="display:flex;justify-content:space-between" class="mono"><span>Итого</span><span>'+fmtRub(28000*S.cart)+'</span></div><button class="btn-dark" id="checkout" style="height:52px">Оформить</button>'
    : '<p style="margin:0;font-size:18px;font-weight:300">Пока пусто.</p><button class="btn-dark" data-cart-close data-goc="'+(S.mode==='m'?'i1':'grid')+'" style="height:52px">Смотреть коллекцию</button>';
  inn.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h2 id="cartTitle" class="h1" style="font-size:30px">Корзина</h2><button class="xbtn" data-cart-close aria-label="Закрыть корзину">×</button></div>'+body;
}
function openCart(){
  var sh=$('#cartSheet'), bd=$('#backdrop'); renderCart(); S.lastFocus=document.activeElement;
  sh.hidden=false; bd.hidden=false; requestAnimationFrame(function(){ sh.classList.add('show'); bd.classList.add('show'); });
  setTimeout(function(){ var b=sh.querySelector('button'); b&&b.focus(); }, S.rm?0:200);
}
function closeCart(){
  var sh=$('#cartSheet'), bd=$('#backdrop'); sh.classList.remove('show'); bd.classList.remove('show');
  setTimeout(function(){ sh.hidden=true; bd.hidden=true; }, S.rm?0:600);
  if(S.lastFocus && S.lastFocus.focus) S.lastFocus.focus({preventScroll:true});
}
function addToCart(){
  S.cart++; setCount();
  $$('#card .thread').forEach(function(th){ th.classList.remove('pull'); void th.offsetWidth; if(!S.rm) th.classList.add('pull'); });
  status('Сумка в корзине · '+S.cart);
}

/* ================= wiring ================= */
function wire(){
  scroller.addEventListener('scroll', onScroll, {passive:true});
  // Конец страницы — в кадр вошёл подвал: сообщить карточке «Концепт».
  scroller.addEventListener('scroll', function(){
    var ft = scroller.querySelector('.foot');
    var end = !!ft && ft.getBoundingClientRect().top < window.innerHeight * 0.75;
    if(end !== S.atEnd){ S.atEnd = end; window.dispatchEvent(new CustomEvent('concept:final', {detail:end})); }
  }, {passive:true});
  scroller.addEventListener('wheel', onWheel, {passive:false});
  scroller.addEventListener('touchstart', onTouchStart, {passive:true});
  scroller.addEventListener('touchmove', onTouchMove, {passive:false});
  scroller.addEventListener('touchend', onTouchEnd, {passive:true});
  wireScale();
  site.addEventListener('click', function(e){
    var t = e.target.closest('[data-go],[data-back],.open-item,.tile,.add,#hudCart,#cardCart,#hudMenu,#menuClose,#cardBack,[data-cart-close],[data-q],#checkout,#backdrop');
    if(!t) return;
    if(t.matches('a')) e.preventDefault();
    if(t.id==='backdrop'){ closeCart(); return; }
    if(t.hasAttribute('data-q')){ S.cart = Math.max(0,S.cart+parseInt(t.getAttribute('data-q'),10)); setCount(); renderCart(); return; }
    if(t.id==='checkout'){ renderCart('demo'); return; }
    if(t.hasAttribute('data-cart-close')){ var g=t.getAttribute('data-goc'); closeCart(); if(g){ if(S.cardOpen) closeCard(g); else goToId(g);} return; }
    if(t.id==='hudCart'||t.id==='cardCart'){ openCart(); return; }
    if(t.id==='hudMenu'){ var mn=$('#menu'); mn.hidden=false; S.lastFocus=t; mn.querySelector('button').focus(); return; }
    if(t.id==='menuClose'){ $('#menu').hidden=true; t===document.activeElement && $('#hudMenu').focus(); return; }
    if(t.id==='cardBack'){ closeCard(); return; }
    if(t.classList.contains('add')){ addToCart(); return; }
    if(t.hasAttribute('data-back')){ closeCard(t.getAttribute('data-back')); return; }
    if(t.hasAttribute('data-go')){ var mnu=$('#menu'); if(mnu) mnu.hidden=true; goToId(t.getAttribute('data-go')); return; }
    if(t.classList.contains('open-item') || t.classList.contains('tile')){
      var i = parseInt(t.getAttribute('data-item'),10);
      if(i!==0){ status('Карточка этой вещи появится позже'); return; }
      var src = t.classList.contains('tile') ? t.querySelector('.ph') : $('[data-id="i1"] .cam',stage);
      openCard(src, IMG+'item1.jpg'); return;
    }
  });
  // desktop hover light on tiles
  var tiles = $('#tiles',stage);
  if(tiles){
    $$('.tile',tiles).forEach(function(tl){
      function on(){ $$('.tile',tiles).forEach(function(x){x.classList.toggle('on',x===tl);}); tiles.classList.add('hovering'); }
      function off(){ tl.classList.remove('on'); if(!tiles.querySelector('.tile.on')) tiles.classList.remove('hovering'); }
      tl.addEventListener('pointerenter',on); tl.addEventListener('pointerleave',off); tl.addEventListener('focus',on); tl.addEventListener('blur',off);
    });
  }
  // card mini time
  var ct = $('#cardTime');
  ct.addEventListener('input',function(){ var v=ct.value/100; $('#mini .later').style.opacity=v; ct.setAttribute('aria-valuetext', v<.5?'Сейчас':'Через годы'); });
  // free zone reveals
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){ es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); en.target.classList.remove('pre'); io.unobserve(en.target);} }); },{root:scroller,threshold:.2});
    $$('.reveal',site).forEach(function(r){ io.observe(r); });
  } else { $$('.reveal',site).forEach(function(r){ r.classList.remove('pre'); }); }
  $('#card').addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeCard(); } });
  site.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if(!$('#cartSheet').hidden) closeCart(); else if($('#menu') && !$('#menu').hidden){ $('#menu').hidden=true; $('#hudMenu').focus(); } } });
}
document.addEventListener('keydown', onKey);
var rzT; window.addEventListener('resize', function(){ clearTimeout(rzT); rzT=setTimeout(fit,200); });

/* ================= rebuild on resize ================= */
function rebuildKeep(){
  var wasCard = S.cardOpen, idx = site ? curIdx() : 0, inFreeZone = site ? inFree() : false, ft = site ? scroller.scrollTop - FREE : 0;
  build();
  if(inFreeZone){ scroller.scrollTop = FREE + Math.max(0,ft); } else { scroller.scrollTop = STOPS[Math.min(idx, STOPS.length-2)].px; }
  render(); settle();
}
build();
setTimeout(function(){ scroller.focus({preventScroll:true}); }, 50);
})();
</script>
